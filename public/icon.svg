<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="55%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect x="28" y="28" width="456" height="456" rx="86" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="6" />
  <!-- Stylized Register Ledger Card -->
  <rect x="108" y="88" width="296" height="224" rx="28" fill="#ffffff" fill-opacity="0.14" stroke="#a7f3d0" stroke-opacity="0.55" stroke-width="6" />
  <!-- Ledger Header Strip -->
  <rect x="108" y="88" width="296" height="54" rx="22" fill="url(#gold)" />
  <!-- Bold Ledger Grid Lines -->
  <line x1="138" y1="184" x2="374" y2="184" stroke="#ecfdf5" stroke-width="10" stroke-linecap="round" />
  <line x1="138" y1="226" x2="374" y2="226" stroke="#a7f3d0" stroke-width="10" stroke-linecap="round" />
  <line x1="138" y1="268" x2="310" y2="268" stroke="#6ee7b7" stroke-width="10" stroke-linecap="round" />
  <line x1="212" y1="158" x2="212" y2="290" stroke="#ecfdf5" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" />
  <!-- Bold MDM Title Pill -->
  <rect x="96" y="344" width="320" height="84" rx="24" fill="url(#gold)" />
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="4">MDM</text>
